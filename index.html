part('robe body',[0,1.15,0],[.92,1.42,.52],black);part('robe left panel',[-.32,1.1,-.015],[.28,1.25,.56],red);part('robe right panel',[.32,1.1,-.015],[.28,1.25,.56],red);part('shirt',[0,1.63,-.28],[.36,.48,.12],wall);part('tie',[0,1.42,-.36],[.12,.48,.06],gold);
for(let x of [-.25,.25]){let leg=part('trousers',[x,.38,0],[.25,.62,.29],dark);let shoe=part('shoe',[x,.12,-.09],[.3,.18,.48],wood)}

// Movement / camera controller (Babylon native equivalent for this Babylon.js build)
let yaw=0,pitch=.03,third=true,vy=0,onGround=true,keys={},locked=false;const playerHeight=2.25,camTarget=new BABYLON.Vector3();

function flatForward(){return new BABYLON.Vector3(Math.sin(yaw),0,Math.cos(yaw))}function right(){return new BABYLON.Vector3(Math.cos(yaw),0,-Math.sin(yaw))}
function updateCam(){camera.rotation.set(pitch,yaw,0);player.getChildMeshes().forEach(m=>m.isVisible=third);wand.isVisible=third;if(third){let dir=new BABYLON.Vector3(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),Math.cos(yaw)*Math.cos(pitch));camera.position.copyFrom(player.position.add(new BABYLON.Vector3(0,1.65,0)).subtract(dir.scale(5.4)));camera.setTarget(player.position.add(new BABYLON.Vector3(0,1.5,0)))}else{camera.position.copyFrom(player.position.add(new BABYLON.Vector3(0,1.72,0)));camera.rotation.set(pitch,yaw,0)}}

scene.onPointerObservable.add(ev=>{if(ev.type===BABYLON.PointerEventTypes.POINTERMOVE&&locked){yaw+=ev.event.movementX*.0022;pitch=Math.max(-1.15,Math.min(1.1,pitch+ev.event.movementY*.0022))}});
canvas.addEventListener('click',()=>{if(!locked){canvas.requestPointerLock?.();document.getElementById('mobileTip').style.opacity=0}});document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===canvas;document.getElementById('mobileTip').style.opacity=locked?0:1});
document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'){e.preventDefault();jump()}if(e.code==='KeyV'&&!e.repeat)setThird(!third);if(e.code==='Equal'&&!e.repeat)beginCharge()});document.addEventListener('keyup',e=>{keys[e.code]=false;if(e.code==='Equal')releaseCharge()});

// Practice dummies with five hit points and floating health bars.
const targets=[];function addTarget(x,z){let post=cyl('target post',[x,1.25,z],2.5,.16,dark);let board=BABYLON.MeshBuilder.CreateCylinder('target board',{height:.22,diameter:1.8,tessellation:12},scene);board.position.set(x,2.35,z);board.rotation.x=Math.PI/2;board.material=red;board.checkCollisions=true;let ring=BABYLON.MeshBuilder.CreateTorus('target rings',{diameter:1.4,thickness:.07,tessellation:20},scene);ring.position.copyFrom(board.position);ring.rotation.x=Math.PI/2;ring.material=gold;let hp=5;const bar=BABYLON.MeshBuilder.CreatePlane('target health bar',{width:1.5,height:.16},scene);bar.position.set(x,3.15,z-.1);bar.billboardMode=BABYLON.Mesh.BILLBOARDMODE_ALL;bar.setPivotPoint(new BABYLON.Vector3(-.5,0,0));const bm=new BABYLON.StandardMaterial('target health fill',scene);bm.diffuseColor=new BABYLON.Color3(.2,.95,.35);bm.emissiveColor=new BABYLON.Color3(.12,.65,.2);bar.material=bm;const back=BABYLON.MeshBuilder.CreatePlane('target health bar background',{width:1.56,height:.22},scene);back.position.set(x,3.15,z+.08);back.billboardMode=BABYLON.Mesh.BILLBOARDMODE_ALL;const backMat=new BABYLON.StandardMaterial('health background',scene);backMat.diffuseColor=new BABYLON.Color3(.12,.08,.08);backMat.emissiveColor=new BABYLON.Color3(.12,.08,.08);back.material=backMat;targets.push({x,z,hp,post,board,ring,bar,back,respawnTimer:null})}[-4,0,4].forEach(x=>addTarget(x,-1));
// A launched fireball that detonates on contact or after its maximum range.
let spellBusy=false;function castSpell(damage=1,charged=false){if(spellBusy)return;spellBusy=true;let dir=flatForward().add(new BABYLON.Vector3(0,.025,0)).normalize();const start=player.position.add(new BABYLON.Vector3(.58,1.38,0)).add(dir.scale(.75));let fireMat=new BABYLON.StandardMaterial('fireball glow',scene);fireMat.diffuseColor=charged?new BABYLON.Color3(.08,.35,1):new BABYLON.Color3(1,.22,.015);fireMat.emissiveColor=charged?new BABYLON.Color3(.03,.22,1):new BABYLON.Color3(1,.15,.005);fireMat.disableLighting=true;let ball=sphere(charged?'arcane nova':'flying fireball',start.asArray(),charged?2.2:.62,mat('fireball core','#ff6b16'),charged?20:12);ball.material=fireMat;let light=new BABYLON.PointLight('fireball light',start,scene);light.diffuse=charged?new BABYLON.Color3(.08,.32,1):new BABYLON.Color3(1,.22,.03);light.intensity=charged?12:2.2;light.range=charged?30:8;let trail=BABYLON.MeshBuilder.CreateSphere('fire trail',{diameter:charged?1.6:.34,segments:charged?16:8},scene);let trailMat=new BABYLON.StandardMaterial('trail glow',scene);trailMat.emissiveColor=charged?new BABYLON.Color3(.12,.48,1):new BABYLON.Color3(1,.28,.015);trailMat.disableLighting=true;trail.material=trailMat;let halo=null;if(charged){halo=BABYLON.MeshBuilder.CreateTorus('arcane halo',{diameter:3.3,thickness:.16,tessellation:32},scene);halo.material=trailMat;halo.position.copyFrom(start)}let distance=0,done=false;const finish=pos=>{if(done)return;done=true;ball.dispose();trail.dispose();light.dispose();if(halo)halo.dispose();let target=targets.find(t=>t.hp>0&&Math.hypot(t.x-pos.x,t.z-pos.z)<1.8&&Math.abs(pos.y-2.35)<1.6);if(target){target.hp=Math.max(0,target.hp-damage);target.bar.scaling.x=target.hp/5;target.bar.material.diffuseColor=target.hp<=2?new BABYLON.Color3(1,.15,.12):new BABYLON.Color3(.2,.95,.35);if(target.hp===0){target.board.isVisible=false;target.ring.isVisible=false;target.bar.isVisible=false;target.back.isVisible=false;target.respawnTimer=setTimeout(()=>{target.hp=5;target.board.isVisible=target.ring.isVisible=target.bar.isVisible=target.back.isVisible=true;target.bar.scaling.x=1;target.bar.material.diffuseColor=new BABYLON.Color3(.2,.95,.35)},2000)}}let blast=sphere('fireball explosion',pos.asArray(),charged?3.6:1.2,fireMat,charged?24:12);let exp=new BABYLON.PointLight('explosion light',pos,scene);exp.diffuse=charged?new BABYLON.Color3(.08,.32,1):new BABYLON.Color3(1,.24,.025);exp.intensity=charged?22:5;exp.range=charged?42:13;let scale=1;const timer=setInterval(()=>{scale+=charged?.32:.18;blast.scaling.setAll(scale);exp.intensity=Math.max(0,exp.intensity-(charged?.42:.55));if(scale>(charged?4.5:2.4)){clearInterval(timer);blast.dispose();exp.dispose();spellBusy=false}},35)};const obs=scene.onBeforeRenderObservable.add(()=>{let step=dir.scale((charged?44:18)*engine.getDeltaTime()/1000);let probe=new BABYLON.Ray(ball.position,dir,step.length()+.75);let hit=scene.pickWithRay(probe,m=>m.checkCollisions&&m!==player);if(hit?.hit&&hit.pickedPoint){scene.onBeforeRenderObservable.remove(obs);finish(hit.pickedPoint);return}for(const target of targets){if(target.hp>0&&Math.hypot(ball.position.x-target.x,ball.position.z-target.z)<(charged?2:1.1)&&Math.abs(ball.position.y-2.35)<(charged?1.8:1)){scene.onBeforeRenderObservable.remove(obs);finish(ball.position.clone());return}}ball.position.addInPlace(step);trail.position.copyFrom(ball.position.subtract(dir.scale(charged?1.25:.38)));if(halo){halo.position.copyFrom(ball.position);halo.rotation.z+=.16}light.position.copyFrom(ball.position);distance+=step.length();if(distance>55){scene.onBeforeRenderObservable.remove(obs);finish(ball.position.clone())}});}
let chargeStart=0,charging=false,chargeReady=false,chargePreview=null,chargeSpirals=[],chargeAnim=0;const chargeBtn=document.getElementById('spellBtn');function beginCharge(){if(charging||spellBusy)return;charging=true;chargeReady=false;chargeStart=performance.now();chargePreview=sphere('charging blue orb',player.position.add(new BABYLON.Vector3(0,1.6,0)).add(flatForward().scale(2)).asArray(),.2,mat('charge orb','#198cff'),18);chargePreview.material.emissiveColor=new BABYLON.Color3(.04,.3,1);chargePreview.material.disableLighting=true;chargeSpirals=Array.from({length:3},()=>{let m=new BABYLON.StandardMaterial('spiral energy material',scene);m.emissiveColor=new BABYLON.Color3(.1,.55,1);m.disableLighting=true;return {mesh:null,material:m}});chargeBtn.style.transform='scale(1.28)';chargeBtn.innerHTML='🔥<span>蓄力中…</span>';chargeBtn.style.boxShadow='0 0 32px #ff7022';const tick=()=>{if(!charging)return;const pct=Math.min(1,(performance.now()-chargeStart)/2000);if(chargePreview){const look=third?player.position.add(new BABYLON.Vector3(0,1.6,0)).add(flatForward().scale(2)):camera.position.add(camera.getDirection(BABYLON.Axis.Z).scale(2.2));chargePreview.position.copyFrom(look);chargePreview.scaling.setAll(.12+pct*.28);chargeAnim+=.16;for(let j=0;j<chargeSpirals.length;j++){const old=chargeSpirals[j].mesh;if(old)old.dispose();const path=[];for(let k=0;k<=24;k++){const u=k/24,angle=u*Math.PI*5+chargeAnim+j*Math.PI*2/3,radius=.24*(1-u);path.push(look.add(new BABYLON.Vector3(Math.cos(angle)*radius,Math.sin(angle)*radius,Math.sin(angle*.7+j)*radius*.55)))}const line=BABYLON.MeshBuilder.CreateTube('spiral charging stream',{path,radius:.012+pct*.008,tessellation:6},scene);line.material=chargeSpirals[j].material;chargeSpirals[j].mesh=line}}if(pct>=1&&!chargeReady){chargeReady=true;chargeBtn.innerHTML='🔵<span>大招就绪！松开发射</span>';chargeBtn.style.background='radial-gradient(circle,#eafaff,#168dff 48%,#161b85)';chargeBtn.style.boxShadow='0 0 42px #39aaff';chargeBtn.style.transform='scale(1.38)'}if(charging)requestAnimationFrame(tick)};requestAnimationFrame(tick)}function releaseCharge(){if(!charging)return;const elapsed=performance.now()-chargeStart;charging=false;chargeReady=false;if(chargePreview){chargePreview.dispose();chargePreview=null}chargeSpirals.forEach(q=>{if(q.mesh)q.mesh.dispose();q.material.dispose()});chargeSpirals=[];chargeBtn.style.transform='';chargeBtn.style.boxShadow='';chargeBtn.style.background='';chargeBtn.innerHTML='🔥<span>+= 蓄力</span>';if(elapsed>=2000)castSpell(3,true);else{const toast=document.getElementById('toast');toast.textContent='蓄力不足：按住 R 至少 2 秒';toast.style.opacity=1;setTimeout(()=>toast.style.opacity=0,1300)}}chargeBtn.addEventListener('pointerdown',e=>{e.preventDefault();beginCharge()});chargeBtn.addEventListener('pointerup',releaseCharge);chargeBtn.addEventListener('pointerleave',releaseCharge);function castLaser(){if(spellBusy)return;spellBusy=true;const dir=flatForward().add(new BABYLON.Vector3(0,.025,0)).normalize(),origin=player.position.add(new BABYLON.Vector3(0,1.45,0)).add(dir.scale(.7));let ray=new BABYLON.Ray(origin,dir,42),hit=scene.pickWithRay(ray,m=>m.checkCollisions&&m!==player);let end=hit?.hit&&hit.pickedPoint?hit.pickedPoint:origin.add(dir.scale(42));let beam=BABYLON.MeshBuilder.CreateTube('instant laser',{path:[origin,end],radius:.12,tessellation:10},scene);let lm=new BABYLON.StandardMaterial('laser crimson glow',scene);lm.emissiveColor=new BABYLON.Color3(1,.015,.025);lm.disableLighting=true;beam.material=lm;let target=targets.find(t=>t.hp>0&&Math.hypot(t.x-end.x,t.z-end.z)<1.5&&Math.abs(end.y-2.35)<1.4);if(target){target.hp=Math.max(0,target.hp-1);target.bar.scaling.x=target.hp/5;target.bar.material.diffuseColor=target.hp<=2?new BABYLON.Color3(1,.15,.12):new BABYLON.Color3(.2,.95,.35);if(target.hp===0){target.board.isVisible=target.ring.isVisible=target.bar.isVisible=target.back.isVisible=false;target.respawnTimer=setTimeout(()=>{target.hp=5;target.board.isVisible=target.ring.isVisible=target.bar.isVisible=target.back.isVisible=true;target.bar.scaling.x=1;target.bar.material.diffuseColor=new BABYLON.Color3(.2,.95,.35)},2000)}}let flare=sphere('laser impact',end.asArray(),.5,mat('laser impact material','#73eaff'),12);flare.material.emissiveColor=new BABYLON.Color3(.15,.8,1);flare.material.disableLighting=true;setTimeout(()=>{beam.dispose();flare.dispose();spellBusy=false},180)}canvas.addEventListener('pointerdown',e=>{if(e.button===0&&!e.target.closest('button'))castLaser()});
